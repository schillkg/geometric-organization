<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img"><title>Two fiber directions define a local plane</title><desc>Schematic of two tangent fiber directions on a plane and its perpendicular normal. q describes consistency of this plane field across a neighborhood.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#246b68"/></marker><marker id="navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#172c3b"/></marker></defs><g fill="none" stroke-linecap="round"><path d="M115 275 450 145 780 235 445 366Z" fill="#e1eae4" stroke="#93aaa0" stroke-width="1.5"/><g stroke="#b4c6bb" stroke-width="1"><path d="m180 250 330 91m-265-116 330 91m-265-116 330 91m-265-116 330 91M180 293 515 162m-270 148 335-130m-269 148 335-130m-269 148 335-130"/></g><path d="M260 290 624 195" stroke="#172c3b" stroke-width="4" marker-end="url(#navy)"/><path d="m285 205 324 115" stroke="#246b68" stroke-width="4" marker-end="url(#arrow)"/><path d="M449 255 449 65" stroke="#246b68" stroke-width="3" marker-end="url(#arrow)"/><circle cx="449" cy="255" r="5" fill="#172c3b"/><path d="m449 230 23 8 0 25" stroke="#7a948a" stroke-width="1.5"/></g><g fill="#172c3b" font-family="system-ui,sans-serif"><text x="635" y="190" font-size="22">direction 1</text><text x="610" y="348" font-size="22">direction 2</text><text x="467" y="72" font-size="22">plane normal n</text><text x="95" y="95" font-size="15" fill="#54716b" letter-spacing="2">LOCAL REFERENCE PLANE</text><text x="95" y="121" font-size="18">One plane for each direction pair</text></g></svg>