<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-labelledby="title desc"><title id="title">Circular and elongated angular spread</title><desc id="desc">Antipodal angular-spread schematics with the same central fiber axis, axial length and broad extent. The elongated cone has one third the narrow width. End-on views show an equal-width circle and a three-to-one ellipse.</desc><defs></defs><g font-family="Helvetica"><rect width="900" height="410" rx="22" fill="#faf8f2"/><text font-family="sans-serif" x="225" y="46" fill="#183440" font-size="25" text-anchor="middle" font-weight="500">Circular spread</text><text font-family="sans-serif" x="675" y="46" fill="#183440" font-size="25" text-anchor="middle" font-weight="500">Elongated spread</text><path d="M168 64V333" fill="none" stroke="#183440" stroke-opacity=".5" stroke-width="1.3" stroke-dasharray="4 5"/><path d="M86 111 Q168 55 250 111 L168 197 Z" fill="#d6e7dd" fill-opacity=".55" stroke="#267e77" stroke-opacity=".5" stroke-width="1.4"/><path d="M86 283 Q168 339 250 283 L168 197 Z" fill="#d6e7dd" fill-opacity=".55" stroke="#267e77" stroke-opacity=".5" stroke-width="1.4"/><ellipse cx="168" cy="111" rx="82" ry="28.0000" fill="#dce9df" fill-opacity=".9" stroke="#267e77" stroke-width="1.8"/><path d="M86 111 L168 197 L250 111" fill="none" stroke="#267e77" stroke-width="1.8"/><ellipse cx="168" cy="283" rx="82" ry="28.0000" fill="#dce9df" fill-opacity=".9" stroke="#267e77" stroke-width="1.8"/><path d="M86 283 L168 197 L250 283" fill="none" stroke="#267e77" stroke-width="1.8"/><circle cx="168" cy="197" r="4" fill="#183440"/><path d="M618 64V333" fill="none" stroke="#183440" stroke-opacity=".5" stroke-width="1.3" stroke-dasharray="4 5"/><path d="M536 111 Q618 92.33333333333333 700 111 L618 197 Z" fill="#d6e7dd" fill-opacity=".55" stroke="#267e77" stroke-opacity=".5" stroke-width="1.4"/><path d="M536 283 Q618 301.6666666666667 700 283 L618 197 Z" fill="#d6e7dd" fill-opacity=".55" stroke="#267e77" stroke-opacity=".5" stroke-width="1.4"/><ellipse cx="618" cy="111" rx="82" ry="9.3333" fill="#dce9df" fill-opacity=".9" stroke="#267e77" stroke-width="1.8"/><path d="M536 111 L618 197 L700 111" fill="none" stroke="#267e77" stroke-width="1.8"/><ellipse cx="618" cy="283" rx="82" ry="9.3333" fill="#dce9df" fill-opacity=".9" stroke="#267e77" stroke-width="1.8"/><path d="M536 283 L618 197 L700 283" fill="none" stroke="#267e77" stroke-width="1.8"/><circle cx="618" cy="197" r="4" fill="#183440"/><circle cx="340" cy="200" r="61" fill="#f0f2ea"/><ellipse cx="340" cy="200" rx="48" ry="48" fill="#c0dcd0" fill-opacity=".8" stroke="#267e77" stroke-width="2"/><circle cx="340" cy="200" r="3.2" fill="#183440"/><text font-family="sans-serif" x="340" y="286" fill="#5a7478" font-size="16" text-anchor="middle" font-weight="400">End-on</text><circle cx="790" cy="200" r="61" fill="#f0f2ea"/><ellipse cx="790" cy="200" rx="48" ry="16" fill="#c0dcd0" fill-opacity=".8" stroke="#267e77" stroke-width="2"/><circle cx="790" cy="200" r="3.2" fill="#183440"/><text font-family="sans-serif" x="790" y="286" fill="#5a7478" font-size="16" text-anchor="middle" font-weight="400">End-on</text><text font-family="sans-serif" x="225" y="355" fill="#183440" font-size="19" text-anchor="middle" font-weight="400">Equal transverse widths</text><text font-family="sans-serif" x="675" y="355" fill="#183440" font-size="19" text-anchor="middle" font-weight="400">Broad and narrow widths</text><text font-family="sans-serif" x="450" y="390" fill="#5a7478" font-size="16" text-anchor="middle" font-weight="400">Angular spread about the fiber axis</text></g></svg>
