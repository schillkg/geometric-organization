<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img"><title>Circular and elongated angular spread</title><desc>Two antipodal cone schematics contrast circular and unequal transverse angular spread. Width is an opening angle, not tissue size.</desc><defs><marker id="axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#172c3b"/></marker></defs><g stroke="#246b68" stroke-width="2" fill="#dce7df"><path d="M245 218 130 118Q245 48 360 118Z"/><path d="M245 218 130 308Q245 378 360 308Z"/><ellipse cx="245" cy="118" rx="115" ry="42"/><ellipse cx="245" cy="308" rx="115" ry="42"/><path d="M675 218 535 123Q675 70 815 123Z"/><path d="M675 218 535 303Q675 356 815 303Z"/><ellipse cx="675" cy="123" rx="140" ry="25"/><ellipse cx="675" cy="303" rx="140" ry="25"/></g><g stroke="#172c3b" stroke-width="1.5" fill="none" stroke-dasharray="5 6"><path d="M245 358V45" marker-end="url(#axis)"/><path d="M675 345V45" marker-end="url(#axis)"/></g><g fill="#172c3b"><circle cx="245" cy="218" r="4"/><circle cx="675" cy="218" r="4"/></g><g font-family="system-ui,sans-serif" fill="#172c3b"><text x="127" y="30" font-size="23">Circular spread</text><text x="550" y="30" font-size="23">Elongated spread</text><text x="128" y="396" font-size="17" fill="#54716b">No unique transverse axis</text><text x="546" y="396" font-size="17" fill="#54716b">Broad and narrow angular widths</text></g></svg>