<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img"><title>Sheet-like and tube-like transverse contrast</title><desc>Conceptual plane layers and concentric tube sections illustrate different spatial contrast patterns around a fiber axis, not anatomical boundaries.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#172c3b"/></marker></defs><g stroke="#72958c" stroke-width="1.5" fill="#dce7df"><path d="m60 225 190-105 150 90-190 105z"/><path d="m60 190 190-105 150 90-190 105z" opacity=".75"/><path d="m60 155 190-105 150 90-190 105z" opacity=".55"/></g><g stroke="#246b68" fill="none" stroke-width="2"><path d="m90 195 265-145m-250 165 265-145m-250 165 265-145" opacity=".65"/><ellipse cx="670" cy="208" rx="129" ry="87"/><ellipse cx="670" cy="208" rx="98" ry="66"/><ellipse cx="670" cy="208" rx="66" ry="44"/><ellipse cx="670" cy="208" rx="33" ry="22"/></g><g stroke="#172c3b" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="m125 258 223-124"/><path d="M670 208 771 70"/></g><g font-family="system-ui,sans-serif" fill="#172c3b"><text x="80" y="356" font-size="24">Sheet-like contrast</text><text x="560" y="356" font-size="24">Tube-like contrast</text><text x="80" y="385" font-size="17" fill="#54716b">One dominant transverse contrast axis</text><text x="560" y="385" font-size="17" fill="#54716b">Contrast in two transverse directions</text><text x="318" y="114" font-size="17">fiber axis</text><text x="780" y="65" font-size="17">fiber axis</text></g><path d="M453 80V315" stroke="#c7cec4" stroke-width="1" stroke-dasharray="3 7"/></svg>