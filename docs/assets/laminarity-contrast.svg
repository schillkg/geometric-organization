<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-labelledby="title desc"><title id="title">Layered and radial transverse contrast</title><desc id="desc">End-on schematics of spatial contrast around one fiber population. Parallel bands vary across a layer normal; concentric bands vary radially around a tube. The dot-in-circle symbols identify the same fiber axis toward the viewer.</desc><defs><clipPath id="layer-window"><rect x="107" y="85" width="250" height="232" rx="12"/></clipPath></defs><g font-family="Helvetica"><rect width="900" height="410" rx="22" fill="#faf8f2"/><text font-family="sans-serif" x="232" y="47" fill="#183440" font-size="25" text-anchor="middle" font-weight="500">Sheet-like</text><text font-family="sans-serif" x="668" y="47" fill="#183440" font-size="25" text-anchor="middle" font-weight="500">Tube-like</text><g clip-path="url(#layer-window)"><rect x="107" y="85.000" width="250" height="25.878" fill="#edf0e8"/><rect x="107" y="110.778" width="250" height="25.878" fill="#dce7dd"/><rect x="107" y="136.556" width="250" height="25.878" fill="#b8d5c6"/><rect x="107" y="162.333" width="250" height="25.878" fill="#74ae9b"/><rect x="107" y="188.111" width="250" height="25.878" fill="#267e77"/><rect x="107" y="213.889" width="250" height="25.878" fill="#74ae9b"/><rect x="107" y="239.667" width="250" height="25.878" fill="#b8d5c6"/><rect x="107" y="265.444" width="250" height="25.878" fill="#dce7dd"/><rect x="107" y="291.222" width="250" height="25.878" fill="#edf0e8"/></g><rect x="107" y="85" width="250" height="232" rx="12" fill="none" stroke="#c4d5ca" stroke-width="1.3"/><circle cx="668" cy="201" r="116" fill="#edf0e8"/><circle cx="668" cy="201" r="103" fill="#dce7dd"/><circle cx="668" cy="201" r="89" fill="#c3dbce"/><circle cx="668" cy="201" r="75" fill="#9fc7b5"/><circle cx="668" cy="201" r="61" fill="#74ae9b"/><circle cx="668" cy="201" r="47" fill="#4c9785"/><circle cx="668" cy="201" r="32" fill="#267e77"/><circle cx="668" cy="201" r="116" fill="none" stroke="#c4d5ca" stroke-width="1.3"/><circle cx="232" cy="201" r="12" fill="#faf8f2" fill-opacity=".95" stroke="#183440" stroke-width="1.7"/><circle cx="232" cy="201" r="3.6" fill="#183440"/><circle cx="668" cy="201" r="12" fill="#faf8f2" fill-opacity=".95" stroke="#183440" stroke-width="1.7"/><circle cx="668" cy="201" r="3.6" fill="#183440"/><text font-family="sans-serif" x="232" y="350" fill="#183440" font-size="20" text-anchor="middle" font-weight="400">Contrast across layers</text><text font-family="sans-serif" x="668" y="350" fill="#183440" font-size="20" text-anchor="middle" font-weight="400">Radial contrast</text><circle cx="330" cy="384" r="7" fill="none" stroke="#5a7478" stroke-width="1.3"/><circle cx="330" cy="384" r="2.4" fill="#5a7478"/><text font-family="sans-serif" x="347" y="390" fill="#5a7478" font-size="16" text-anchor="start" font-weight="400">Fiber axis toward you</text></g></svg>
